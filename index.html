document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ref=\"#contact\" style=\"white-space: nowrap; flex: none; text-decoration: none; color: var(--color-bg);\">Contact<i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><\u002Fa>\n<\u002Fnav>\n\n<aside aria-label=\"Section progress\" style=\"position: fixed; right: clamp(12px, 2vw, 24px); bottom: 20px; z-index: 10; display: flex; align-items: center; gap: 12px; padding: 8px 14px; background: var(--color-bg); border: 1px solid var(--color-divider); border-radius: 999px; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; font-feature-settings: 'tnum' 1;\">\n  \n  <div style=\"display: flex; gap: 4px; align-items: center;\">\n    <sc-for list=\"{{ navSections }}\" as=\"ns\" hint-placeholder-count=\"7\">\n      <sc-if value=\"{{ ns.active }}\" hint-placeholder-val=\"{{ false }}\">\n        <a href=\"#{{ ns.id }}\" aria-label=\"{{ ns.label }}\" aria-current=\"location\" style=\"display: block; width: 22px; height: 12px; padding: 5px 0; background: var(--color-accent); background-clip: content-box;\"><\u002Fa>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ ns.inactive }}\" hint-placeholder-val=\"{{ true }}\">\n        <a href=\"#{{ ns.id }}\" aria-label=\"{{ ns.label }}\" style=\"display: block; width: 10px; height: 12px; padding: 5px 0; background: var(--color-divider); background-clip: content-box;\"><\u002Fa>\n      <\u002Fsc-if>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <span style=\"white-space: nowrap;\">{{ curLabel }}<\u002Fspan>\n<\u002Faside>\n\n<main ref=\"{{ mainRef }}\" style=\"max-width: 1200px; margin: 0 auto; padding: 0 clamp(20px, 5vw, 72px);\">\n\n  <section id=\"about\" data-screen-label=\"01 Intro\" style=\"padding: 72px 0 72px; display: flex; flex-wrap: wrap; gap: 48px clamp(32px, 5vw, 72px); align-items: flex-start;\">\n    <div style=\"flex: 1 1 400px; min-width: 0; display: flex; flex-direction: column; gap: 28px;\">\n      <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n        <span style=\"font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; color: var(--color-accent-700);\">Space Engineering · Autonomous Systems · Onboard AI · Energy-efficient AI · Trustworthy AI<\u002Fspan>\n        <h1 style=\"font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: clamp(48px, 7vw, 92px); line-height: 0.98; letter-spacing: 0.01em; text-transform: uppercase; margin: 0 0 0 -0.04em;\">\n          <span style=\"display: block;\">Cristopher<\u002Fspan>\n          <span style=\"display: block;\">Castro Traba<\u002Fspan>\n        <\u002Fh1>\n      <\u002Fdiv>\n      <p style=\"font-size: 20px; line-height: 1.6; margin: 0; max-width: 62ch;\">Space AI engineer with two years of professional experience deploying AI on board spacecraft, and publications with ESA and NASA JPL. Currently Research Engineer (Guest) at ETH Zurich and “la Caixa” Fellow. I am interested in doing a PhD at the intersection of autonomous space systems and trustworthy AI.<\u002Fp>\n    <\u002Fdiv>\n\n    <figure style=\"flex: 0 1 320px; min-width: 240px; margin: 0; display: flex; flex-direction: column; gap: 12px;\">\n      <sc-if value=\"{{ duotone }}\" hint-placeholder-val=\"{{ true }}\">\n        <div class=\"blueprint duotone\" style=\"aspect-ratio: 433 / 577;\">\n          <img src=\"d0459404-671f-499a-9c0d-f657a0a0ba60\" alt=\"Portrait of Cristopher Castro Traba\" style=\"display: block; width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.05);\">\n          <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ natural }}\" hint-placeholder-val=\"{{ false }}\">\n        <div class=\"blueprint\" style=\"aspect-ratio: 433 / 577; overflow: hidden;\">\n          <img src=\"d0459404-671f-499a-9c0d-f657a0a0ba60\" alt=\"Portrait of Cristopher Castro Traba\" style=\"display: block; width: 100%; height: 100%; object-fit: cover;\">\n          <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <figcaption style=\"display: flex; justify-content: space-between; gap: 12px; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; color: color-mix(in srgb, var(--color-text) 70%, transparent);\"><span>Zurich, Switzerland<\u002Fspan><\u002Ffigcaption>\n    <\u002Ffigure>\n      <nav aria-label=\"Sections\" class=\"blueprint\" style=\"flex: 1 1 100%; display: flex; flex-direction: column; overflow: hidden; border: 0; border-radius: 0; margin-top: 8px;\">\n        <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(max(260px, calc((100% - 2px) / 3)), 1fr)); gap: 1px; background: var(--color-divider);\">\n          <sc-for list=\"{{ jumpLinks }}\" as=\"j\" hint-placeholder-count=\"6\">\n            <a href=\"#{{ j.id }}\" style=\"display: grid; align-items: center; min-height: 76px; padding: 24px 24px; box-sizing: border-box; background: var(--color-bg); text-decoration: none; color: var(--color-text); font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 26px; line-height: 1; text-transform: uppercase; letter-spacing: 0.02em; font-feature-settings: 'tnum' 1; white-space: nowrap; transition: background 0.15s, color 0.15s;\" style-hover=\"background: color-mix(in srgb, var(--color-accent) 14%, var(--color-bg)); color: var(--color-accent-700);\">\n                            <span style=\"font: inherit; text-align: left;\">{{ j.label }}<\u002Fspan>\n            <\u002Fa>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fnav>\n  <\u002Fsection>\n\n  <section id=\"research\" data-screen-label=\"02 Research interests\" style=\"padding: 48px 0 72px; scroll-margin-top: 64px;\">\n    <span style=\"display: block; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; color: var(--color-accent-700); margin-bottom: 12px;\">Research interests<\u002Fspan>\n    <div data-rule=\"\" style=\"height: 1px; background: var(--color-divider); margin-bottom: 36px;\"><\u002Fdiv>\n    <div data-stagger=\"\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 24px clamp(32px, 5vw, 72px); margin-bottom: 48px;\">\n      <h2 style=\"font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: clamp(32px, 3.6vw, 44px); line-height: 1.05; text-transform: uppercase; letter-spacing: 0.01em; margin: 0;\">From observers to trusted agents: reliable, intelligent decision-making in space systems<\u002Fh2>\n      <div style=\"display: flex; flex-direction: column; gap: 16px; font-size: 16px; line-height: 1.6;\">\n        <p style=\"margin: 0;\">Modern space systems have deployed AI-based solutions for computer vision and Earth observation, focused mainly on observation rather than critical operations. Intelligent decision-making, such as agentic AI-based planning in single- and multi-agent space systems or direct interaction in human spaceflight, requires an additional layer of reliability that these methods have not addressed. The future of space AI depends on autonomous systems, and trustworthiness is the key to enabling their deployment.<\u002Fp>\n        <p style=\"margin: 0;\">I have worked across the full chain: building datasets from raw sensor data, designing and compressing models, verifying them on embedded flight hardware, and integrating them into mission operations.<\u002Fp>\n        <p style=\"margin: 0;\">I want to pursue a PhD at the intersection of autonomous space systems and trustworthy AI, investigating what agentic AI frameworks can bring to the space domain under strict energy and memory constraints. My focus is the onboard deployment of reliable space systems for spacecraft operations and space robotics, starting from single systems and scaling to multi-agent systems.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div data-stagger=\"\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 40px clamp(20px, 3vw, 40px);\">\n      <sc-for list=\"{{ themes }}\" as=\"t\" hint-placeholder-count=\"3\">\n        <div class=\"blueprint\" style=\"padding: 24px; display: flex; flex-direction: column; gap: 14px;\">\n          <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n                    <h3 style=\"font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 24px; line-height: 1.1; text-transform: uppercase; letter-spacing: 0.02em; margin: 0;\">{{ t.title }}<\u002Fh3>\n          <p style=\"margin: 0; font-size: 15px; line-height: 1.6; color: color-mix(in srgb, var(--color-text) 80%, transparent);\">{{ t.body }}<\u002Fp>\n          <div style=\"display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; padding-top: 6px;\">\n            <sc-for list=\"{{ t.tags }}\" as=\"tag\" hint-placeholder-count=\"3\">\n              <span class=\"tag tag-outline\" style=\"white-space: nowrap; flex: none;\">{{ tag }}<\u002Fspan>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n\n  <section id=\"experience\" data-screen-label=\"03 Experience\" style=\"padding: 48px 0 72px; scroll-margin-top: 64px;\">\n    <span style=\"display: block; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; color: var(--color-accent-700); margin-bottom: 12px;\">Experience<\u002Fspan>\n    <div data-rule=\"\" style=\"height: 1px; background: var(--color-divider); margin-bottom: 32px;\"><\u002Fdiv>\n    <sc-if value=\"{{ showFilter }}\" hint-placeholder-val=\"{{ true }}\">\n      <div role=\"group\" aria-label=\"Filter experience\" style=\"display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 32px;\">\n        <sc-for list=\"{{ filters }}\" as=\"f\" hint-placeholder-count=\"3\">\n          <sc-if value=\"{{ f.active }}\" hint-placeholder-val=\"{{ false }}\">\n            <button type=\"button\" class=\"btn btn-primary\" aria-pressed=\"true\" sc-camel-on-click=\"{{ f.pick }}\" style=\"min-height: 36px;\">{{ f.label }}<\u002Fbutton>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ f.inactive }}\" hint-placeholder-val=\"{{ true }}\">\n            <button type=\"button\" class=\"btn btn-secondary\" aria-pressed=\"false\" sc-camel-on-click=\"{{ f.pick }}\" style=\"min-height: 36px;\">{{ f.label }}<\u002Fbutton>\n          <\u002Fsc-if>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <ol data-stagger=\"\" style=\"list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column;\">\n      <sc-for list=\"{{ experience }}\" as=\"e\" hint-placeholder-count=\"5\">\n        <li style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 8px 32px; padding: 24px 0; border-top: 1px solid var(--color-divider);\">\n          <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n            <sc-if value=\"{{ e.hasLogo }}\" hint-placeholder-val=\"{{ false }}\"><img src=\"{{ e.logoSrc }}\" alt=\"{{ e.org }} logo\" style=\"display: block; width: 92px; height: 92px; object-fit: contain; object-position: left center; margin-bottom: 6px;\"><\u002Fsc-if>\n            <span style=\"font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; font-feature-settings: 'tnum' 1;\">{{ e.dates }}<\u002Fspan>\n            <span style=\"font-size: 13px; color: color-mix(in srgb, var(--color-text) 70%, transparent);\">{{ e.place }}<\u002Fspan>\n            <span style=\"display: flex;\"><span class=\"tag tag-accent\">{{ e.kind }}<\u002Fspan><\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"grid-column: span 2; display: flex; flex-direction: column; gap: 8px; min-width: 0;\">\n            <h3 style=\"font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 24px; line-height: 1.1; text-transform: uppercase; letter-spacing: 0.02em; margin: 0;\">{{ e.role }}<\u002Fh3>\n            <span style=\"font-size: 15px; font-weight: 600; color: var(--color-accent-700);\">{{ e.org }}<\u002Fspan>\n            <ul style=\"margin: 4px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 15px; line-height: 1.55; color: color-mix(in srgb, var(--color-text) 82%, transparent);\">\n              <sc-for list=\"{{ e.points }}\" as=\"pt\" hint-placeholder-count=\"2\">\n                <li>{{ pt }}<\u002Fli>\n              <\u002Fsc-for>\n            <\u002Ful>\n          <\u002Fdiv>\n        <\u002Fli>\n      <\u002Fsc-for>\n    <\u002Fol>\n  <\u002Fsection>\n\n  <section id=\"publications\" data-screen-label=\"04 Publications\" style=\"padding: 48px 0 72px; scroll-margin-top: 64px;\">\n    <span style=\"display: block; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; color: var(--color-accent-700); margin-bottom: 12px;\">Publications &amp; service<\u002Fspan>\n    <div data-rule=\"\" style=\"height: 1px; background: var(--color-divider); margin-bottom: 8px;\"><\u002Fdiv>\n    <div data-stagger=\"\" style=\"display: flex; flex-direction: column;\">\n      <sc-for list=\"{{ pubs }}\" as=\"pb\" hint-placeholder-count=\"3\">\n        <div style=\"display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 8px 24px; padding: 24px 0; border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\">\n          <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n            <span style=\"font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 26px; line-height: 1; font-feature-settings: 'tnum' 1;\">{{ pb.year }}<\u002Fspan>\n            <span style=\"font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-accent-700);\">{{ pb.type }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n            <span style=\"font-size: 17px; line-height: 1.4; font-weight: 600;\">{{ pb.title }}<\u002Fspan>\n            <span style=\"font-size: 14px; line-height: 1.5; color: color-mix(in srgb, var(--color-text) 78%, transparent);\">{{ pb.pre }}<strong style=\"color: var(--color-text);\">Castro Traba, C.<\u002Fstrong>{{ pb.post }}<\u002Fspan>\n            <span style=\"font-size: 14px; line-height: 1.5; font-style: italic;\">{{ pb.venue }}<\u002Fspan>\n            <sc-if value=\"{{ pb.hasLink }}\" hint-placeholder-val=\"{{ false }}\">\n              <a href=\"{{ pb.href }}\" target=\"_blank\" rel=\"noopener\" style=\"font-size: 14px; align-self: flex-start;\">{{ pb.linkLabel }}<\u002Fa>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <div style=\"display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 8px 24px; padding: 24px 0;\">\n        <span style=\"font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-accent-700); padding-top: 4px;\">Service<\u002Fspan>\n        <span style=\"font-size: 15px; line-height: 1.5;\">Reviewer, AI4Space Workshop at the IEEE/CVF Conference on Computer Vision and Pattern Recognition (CVPR) 2026.<\u002Fspan>\n      <\u002Fdiv>\n      <a href=\"https://scholar.google.com/citations?user=uqXMYj4AAAAJ&amp;hl=en\" target=\"_blank\" rel=\"noopener\" class=\"btn btn-secondary\" style=\"align-self: flex-start; text-decoration: none; color: var(--color-text);\">Full list on Google Scholar<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"projects\" data-screen-label=\"05 Projects\" style=\"padding: 48px 0 72px; scroll-margin-top: 64px;\">\n    <span style=\"display: block; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; color: var(--color-accent-700); margin-bottom: 12px;\">Selected projects<\u002Fspan>\n    <div data-rule=\"\" style=\"height: 1px; background: var(--color-divider); margin-bottom: 44px;\"><\u002Fdiv>\n    <div data-stagger=\"\" style=\"display: flex; flex-direction: column; gap: 56px;\">\n      <sc-for list=\"{{ projects }}\" as=\"p\" hint-placeholder-count=\"2\">\n        <article class=\"blueprint\" style=\"display: flex; flex-direction: column;\">\n          <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n          <header style=\"display: flex; flex-wrap: wrap; border-bottom: 1px solid var(--color-divider); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600;\">\n            <span style=\"flex: 1; min-width: 20ch; padding: 12px 24px;\">{{ p.sheet }}<\u002Fspan>\n            <span style=\"white-space: nowrap; padding: 12px 24px; border-left: 1px solid var(--color-divider); color: color-mix(in srgb, var(--color-text) 70%, transparent);\">{{ p.years }}<\u002Fspan>\n          <\u002Fheader>\n          <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr));\">\n            <div style=\"padding: 28px 24px; display: flex; flex-direction: column; gap: 16px;\">\n              <h3 style=\"font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: clamp(28px, 3vw, 36px); line-height: 1.05; text-transform: uppercase; letter-spacing: 0.01em; margin: 0;\">{{ p.title }}<\u002Fh3>\n              <p style=\"margin: 0; font-size: 16px; line-height: 1.6;\">{{ p.problem }}<\u002Fp>\n              <p style=\"margin: 0 ><i class=\"corner br\"><\u002Fi>\n          <span style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-accent-700);\">{{ h.meta }}<\u002Fspan>\n          <h3 style=\"font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 22px; line-height: 1.1; text-transform: uppercase; letter-spacing: 0.02em; margin: 0;\">{{ h.title }}<\u002Fh3>\n          <p style=\"margin: 0; font-size: 14px; line-height: 1.55; color: color-mix(in srgb, var(--color-text) 80%, transparent);\">{{ h.body }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"contact\" data-screen-label=\"07 Contact\" style=\"padding: 48px 0 56px; scroll-margin-top: 64px;\">\n    <span style=\"display: block; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; color: var(--color-accent-700); margin-bottom: 12px;\">Contact<\u002Fspan>\n    <div data-rule=\"\" style=\"height: 1px; background: var(--color-divider); margin-bottom: 36px;\"><\u002Fdiv>\n    <div data-stagger=\"\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 32px clamp(32px, 5vw, 72px); align-items: start;\">\n      <div style=\"display: flex; flex-direction: column; gap: 20px;\">\n        <h2 style=\"font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: clamp(32px, 3.6vw, 44px); line-height: 1.05; text-transform: uppercase; letter-spacing: 0.01em; margin: 0;\">Open to research collaboration<\u002Fh2>\n        <p style=\"margin: 0; font-size: 16px; line-height: 1.6; max-width: 52ch;\">I welcome enquiries about onboard AI, autonomous and distributed space systems, and joint research proposals.<\u002Fp>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 12px;\">\n          <a class=\"btn btn-primary blueprint\" href=\"mailto:castroc@ethz.ch\" style=\"white-space: nowrap; flex: none; text-decoration: none; color: var(--color-bg); min-height: 40px;\">Email castroc@ethz.ch<i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <dl style=\"margin: 0; display: flex; flex-direction: column; border-top: 1px solid var(--color-divider);\">\n        <div style=\"display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--color-divider);\"><dt style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 70%, transparent);\">Email<\u002Fdt><dd style=\"margin: 0; font-size: 15px;\"><a href=\"mailto:castroc@ethz.ch\">castroc@ethz.ch<\u002Fa><\u002Fdd><\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--color-divider);\"><dt style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 70%, transparent);\">Location<\u002Fdt><dd style=\"margin: 0; font-size: 15px;\">Automatic Control Laboratory, ETH Zurich, Switzerland<\u002Fdd><\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--color-divider);\"><dt style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 70%, transparent);\">LinkedIn<\u002Fdt><dd style=\"margin: 0; font-size: 15px;\"><a href=\"https://www.linkedin.com/in/cristophercastrot/\" target=\"_blank\" rel=\"noopener\">linkedin.com/in/cristophercastrot<\u002Fa><\u002Fdd><\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--color-divider);\"><dt style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 70%, transparent);\">GitHub<\u002Fdt><dd style=\"margin: 0; font-size: 15px;\"><a href=\"https://github.com/CristopherCastro\" target=\"_blank\" rel=\"noopener\">github.com/CristopherCastro<\u002Fa><\u002Fdd><\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--color-divider);\"><dt style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 70%, transparent);\">Scholar<\u002Fdt><dd style=\"margin: 0; font-size: 15px;\"><a href=\"https://scholar.google.com/citations?user=uqXMYj4AAAAJ&amp;hl=en\" target=\"_blank\" rel=\"noopener\">Google Scholar profile<\u002Fa><\u002Fdd><\u002Fdiv>\n      <\u002Fdl>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; padding: 24px 0 40px; border-top: 1px solid var(--color-divider); font-size: 13px; color: color-mix(in srgb, var(--color-text) 70%, transparent);\">\n    <span>© 2026 Cristopher Castro Traba<\u002Fspan>\n    <span>Last updated September 2026<\u002Fspan>\n  <\u002Ffooter>\n<\u002Fmain>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;graphite&quot;,&quot;light&quot;],&quot;default&quot;:&quot;dark&quot;,&quot;tsType&quot;:&quot;'dark' | 'graphite' | 'light'&quot;,&quot;section&quot;:&quot;Appearance&quot;},&quot;sectionMotion&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Appearance&quot;},&quot;duotonePortrait&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Imagery&quot;},&quot;showTimelineFilter&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Experience&quot;}}\">\nconst OUT = {\n  help: ['Available commands: ls · cd <section> · whoami · research · now · education · contact · clear'],\n  whoami: ['Cristopher Castro Traba', 'Research Engineer (Guest), Automatic Control Laboratory, ETH Zurich', '“la Caixa” Foundation Postgraduate Fellow'],\n  research: ['On-orbit AI for satellites · Distributed space systems', 'Autonomous space solutions · Space robotics', 'Edge AI · Trustworthy AI'],\n  now: ['Building a simulator for LLM-based orchestration of spacecraft constellations.', 'Next: “Agentic AI for EO” workshop, Berlin, October 2026.'],\n  education: ['M.S. Space Engineering, TU Delft (2024): Cum Laude, Honors Programme', 'B.S. Aerospace Engineering, Universidade de Vigo (2022): GPA 9/10'],\n  contact: ['castroc@ethz.ch · Zurich, Switzerland', 'linkedin.com/in/cristophercastrot · Google Scholar']\n};\n\nconst THEMES = [\n  { num: '01', title: 'Onboard perception', body: 'AI-based decision-making on board the spacecraft enables real-time autonomous operation. Latency-critical tasks demand deployment on energy-efficient space hardware, with applications spanning space robotics, Earth observation and deep-space missions.', tags: ['Real-time autonomy', 'Energy-efficient hardware', 'Deep space'] },\n  { num: '02', title: 'Autonomous & distributed systems', body: 'CNNs, Transformers and VLMs have been validated on board spacecraft for perception tasks. The next step is autonomous decision-making in spacecraft operations, such as agentic AI frameworks for subsystem orchestration and efficient distributed computing across a constellation or swarm.', tags: ['Agentic AI', 'Subsystem orchestration', 'Distributed computing'] },\n  { num: '03', title: 'Trustworthy space AI', body: 'The intersection of trustworthy AI and its deployment in space remains limited. Operations involving critical space systems, such as guiding and assisting astronauts or commanding a spacecraft, require reliable solutions. This open research field is crucial for the future of space AI.', tags: ['Reliability', 'Critical systems', 'Human spaceflight'] }\n];\n\nconst PROJECTS = [\n  { sheet: 'Case study A — TU Delft · Ubotica · ESA Φ-Lab', years: '2023 – 2026', title: 'Onboard thermal hotspot segmentation', problem: 'Detecting thermal anomalies such as wildfires and volcanic activity quickly requires processing imagery in orbit. Conventional pipelines depend on ground-processed products, which adds hours of latency.', approach: 'I designed the first CNN-based onboard payload pipeline for real-time thermal hotspot segmentation in raw multispectral imagery. I developed automatic labelling to produce the first segmentation dataset of raw Sentinel-2 hotspots, contributed to THRawS (the first open raw Sentinel-2 dataset for hotspot detection), and verified the full pipeline on CubeSat-class hardware, measuring power draw and inference latency.', spec: [\n    { num: '01', k: 'Data', v: 'Raw Sentinel-2 multispectral imagery (THRawS)' },\n    { num: '02', k: 'Hardware', v: 'Raspberry Pi 3B+ · CogniSAT-XE2 board' },\n    { num: '03', k: 'Supervision', v: 'Dr. J. Guo, D. Rijlaarsdam, Dr. G. Meoni, Dr. R. Del Prete' },\n    { num: '04', k: 'Outputs', v: 'M.S. thesis (9/10); journal article, Int. J. Appl. Earth Obs. Geoinf., 2026' }\n  ] },\n  { sheet: 'Case study B — NASA JPL · Ubotica', years: '2024 – 2025', title: 'Dynamic Targeting', problem: 'Dynamic Targeting lets a satellite analyse imagery on board and re-plan its own observations in orbit, for example to avoid clouds or follow a feature of interest, without waiting for commands from the ground.', approach: 'In collaboration with NASA Jet Propulsion Laboratory, I contributed to satellite operations and image analysis on the CogniSAT-6/HAMMER mission, the in-orbit platform used to demonstrate the concept.', spec: [\n    { num: '01', k: 'Platform', v: 'CogniSAT-6 / HAMMER' },\n    { num: '02', k: 'Partners', v: 'NASA Jet Propulsion Laboratory · Ubotica Technologies' },\n    { num: '03', k: 'Role', v: 'Satellite operations · image analysis' },\n    { num: '04', k: 'Outputs', v: 'Flight report, ASTRA 2025; journal article in preparation' }\n  ] }\n];\n\nconst LOGOS = {\"eth\":\"data:image/webp;base64,UklGRmgJAABXRUJQVlA4WAoAAAAgAAAAtQAAWwAASUNDUMgBAAAAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlkZXNjAAAA8AAAACRyWFlaAAABFAAAABRnWFlaAAABKAAAABRiWFlaAAABPAAAABR3dHB0AAABUAAAABRyVFJDAAABZAAAAChnVFJDAAABZAAAAChiVFJDAAABZAAAAChjcHJ0AAABjAAAADxtbHVjAAAAAAAAAAEAAAAMZW5VUwAAAAgAAAAcAHMAUgBHAEJYWVogAAAAAAAAb6IAADj1AAADkFhZWiAAAAAAAABimQAAt4UAABjaWFlaIAAAAAAAACSgAAAPhAAAts9YWVogAAAAAAAA9tYAAQAAAADTLXBhcmEAAAAAAAQAAAACZmYAAPKnAAANWQAAE9AAAApbAAAAAAAAAABtbHVjAAAAAAAAAAEAAAAMZW5VUwAAACAAAAAcAEcAbwBvAGcAbABlACAASQBuAGMALgAgADIAMAAxADZWUDggegcAAHAoAJ0BKrYAXAA+USKPRSOiIZTsXQg4BQS0ojuBtCf8z/Frvi/nP5Gf07sqvD/shnHPqt9T/of7O+sn9u/GD8ZvZXgBfhf8n/w/5Q8AVMd6gXdz/CflV/Uudj6kf4D3AP41/Hf7z+X3qk/2bxTO4/YA/j39A/0v9z/KX4i/67/Kfk57VvzH+7/8b/CfAX/Lf6j/vf7l/hv+/3av3L9iz9nzR1AVgwO2sRpTdiVaXr9lybok78Oyeb5G6w0v2OUkI1YBsfKg0EzZxWD7JVFz1+1kBG9GpBDJg7yU59imAORUf7wTi0HHiydQwDYeQrO1jdKHUAI7KK4eg9vOzmzIiYjoOSHHCT/E5wiaEyJDcP6P6SdO+TAFkNbboIPW4QYYzKTOah5rqrPbit5kBhIRId37BRociRljuEDRbkBHhO5NuRfS3ZAVgwO2vKSwAP79wIACRyDLg3+IUYSvWGY+H4EoB9M7dw6J2Pe+sUxPaKOqIfH/4RkqS8ygr58cLtoeZ2kMU8cN3JWCjCV6vbtBytGwYuRUYBLSsqPNQK7UqMaNnFBzLVGQM3akWymF2bpJO3mvL7BOf1fUjYb446LcSZCKSlcJ1t3x1KAgoKGHa+Rh3zQhGDfEg/Ew8GN48ej72lGQ//KTPQu0K2Rpja/ygFT1T7Q3f/D+sqP+hMpXlpQ84qWmkTvEy2BlfoHS21gXDsTIT/up86nqUi0twAGCKzKugDl39T8UHkLNbsR0orCtRM0MyA+7dxhbx13K5M8/v8jhivbsPMAaYeB+5OPJYlcOvkGPGwJAiGu5zDHCZS2acuj3P+xCgDwYdP6KZlgGiJ/Q8EiWHMsEM0QTF9ZcyYJXB+MjL3y5vZhAOGQ72LeeB4s63/F+7WMrAWC4Eg ct on multi-constellation system orchestration, responsible for system definition and verification through CDR.', 'Technical director of a deep learning project using embedding-based classification for Earth observation.', 'Developed and verified C++ flight software for CogniSAT-6/HAMMER; supervised an M.S. thesis on explainable AI for EO foundation models.'] },\n  { logo: 'ubotica-2024', kind: 'Industry', dates: 'Oct 2024 – Aug 2025', place: 'Delft, Netherlands', role: 'Space AI Applications Engineer', org: 'Ubotica Technologies', points: ['Trained one segmentation and two classification networks for optical satellite imagery and deployed them on resource-constrained satellite hardware.', 'Designed flight software, CONOPS and an image simulator of the CogniSAT-6/HAMMER sensor for ground verification.', 'Collaborated with NASA JPL on Dynamic Targeting (satellite operations and image analysis).', 'Contributed to a large-scale AI maritime platform with Fugro and DTACT.'] },\n  { logo: 'esa', kind: 'Research', dates: 'May 2024 – Aug 2024', place: 'Rome, Italy', role: 'Visiting Researcher', org: 'Φ-Lab, European Space Agency', points: ['Implemented and trained deep learning models for thermal hotspot segmentation in raw multispectral imagery.', 'Contributed to the THRawS dataset and to optimising AI for edge computing on spacecraft.'] },\n  { logo: 'ubotica-thesis', kind: 'Research', dates: 'Dec 2023 – Sept 2024', place: 'Delft, Netherlands', role: 'Master Thesis Researcher', org: 'Ubotica Technologies & European Space Agency', points: ['Built the first CNN-based onboard pipeline for real-time hotspot segmentation in raw imagery, verified on Raspberry Pi 3B+ and CogniSAT-XE2.', 'Generated the first segmentation dataset for thermal hotspots in raw Sentinel-2 imagery.'] },\n  { logo: 'tudelft', kind: 'Research', dates: 'Jul 2023 – Dec 2023', place: 'Delft, Netherlands', role: 'Graduate Researcher', org: 'Space Engineering Department, TU Delft', points: ['Implemented MLPs and LSTMs for spacecraft telemetry analysis on resource-constrained microcontrollers, compiling TensorFlow Lite for C++ on embedded CubeSat processors.'] },\n  { logo: 'ubotica-2023', kind: 'Industry', dates: 'Jul 2023 – Dec 2023', place: 'Delft, Netherlands', role: 'Optical Satellite Imagery Processing Intern', org: 'Ubotica Technologies', points: ['Developed a pipeline from raw optical imagery to orthorectified top-of-atmosphere reflectance, including computer-vision co-registration, verified on Sentinel-2 and hyperspectral data.'] },\n  { logo: 'uvigo', kind: 'Research', dates: 'Sept 2021 – Jul 2022', place: 'Galicia, Spain', role: 'Undergraduate Researcher', org: 'Physics Engineering Group, Universidade de Vigo', points: ['Developed a LiDAR-based algorithm for relative pose estimation of uncooperative spacecraft, and designed a 6-DOF satellite test structure for sensor validation.'] }\n];\n\nconst PUBS = [\n  { year: '2026', type: 'Journal', title: 'Towards onboard thermal hotspots segmentation with raw multispectral satellite imagery', pre: '', post: ', Rijlaarsdam, D., Guo, J., Del Prete, R., Meoni, G.', venue: 'International Journal of Applied Earth Observation and Geoinformation, 146, 105095', href: 'https://doi.org/10.1016/j.jag.2026.105095', linkLabel: 'doi:10.1016/j.jag.2026.105095' },\n  { year: '2025', type: 'Conference', title: 'Dynamic Targeting: Flight Report', pre: 'Chien, S.A., Zilberstein, I., Candela, A., Barretta, D., Rijlaarsdam, D., Hendrix, T., Dunne, A., Perrocheau, A., ', post: ', Cortes Grau, O., et al.', venue: 'Proc. 18th Symposium on Advanced Space Technologies in Robotics and Automation (ASTRA)' },\n  { year: '2023', type: 'Conference', title: 'Relative pose determination algorithm for space on-orbit close range autonomous operation', pre: '', post: ', Fontenla-Carrera, G., González-deSantos, L.M., González-Jorge, H.', venue: 'International Society for Photogrammetry and Remote Sensing (ISPRS) Congress, Egypt' }\n];\n\nconst HONORS = [\n  { meta: 'Fellowship · 2026', title: '“la Caixa” Postgraduate Fellowship', body: 'Awarded to the top 5% of candidates to carry out research at Tier-1 international institutions; held at ETH Zurich.' },\n  { meta: 'M.S. · TU Delft · 2024', title: 'Cum Laude & Honors Programme', body: 'Graduated Cum Laude and completed the Honors Programme, a distinction awarded only to the top 1% of students, including 20 additional credits in business leadership and research.' },\n  { meta: 'B.S. · Universidade de Vigo · 2022', title: 'Bachelor Thesis Fellowship', body: '€2,000 awarded for the thesis on LiDAR-based relative pose determination (graded 10/10), alongside 10+ distinctions with honours.' }\n];\n\nconst SECTIONS = [\n  { id: 'about', label: 'Profile' }, { id: 'research', label: 'Research interests' }, { id: 'experience', label: 'Experience' }, { id: 'publications', label: 'Publications' },\n  { id: 'projects', label: 'Projects' }, { id: 'honors', label: 'Distinctions' }, { id: 'contact', label: 'Contact' }\n];\n\nclass Component extends DCLogic {\n  state = { lines: [], input: '', typing: '', busy: false, filter: 'All', current: 0 };\n  mainRef = React.createRef();\n  bodyRef = React.createRef();\n  inputRef = React.createRef();\n\n  componentDidMount() {\n    this._alive = true;\n    this.applyTheme();\n    requestAnimationFrame(() => this.setupMotion());\n    const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    const seq = ['whoami', 'now', 'ls'];\n    \n  }\n  componentWillUnmount() { this._alive = false; (this._obs || []).forEach(o => o.disconnect()); }\n  componentDidUpdate() { const b = this.bodyRef.current; if (b) b.scrollTop = b.scrollHeight; this.applyTheme(); }\n  applyTheme() { document.documentElement.dataset.theme = this.props.theme ?? 'dark'; }\n\n  setupMotion() {\n    const main = this.mainRef.current; if (!main) return;\n    const secs = [...main.querySelectorAll(':scope > section')];\n    const spy = new IntersectionObserver(es => es.forEach(en => {\n      if (en.isIntersecting) { const i = secs.indexOf(en.target); if (i >= 0 && i !== this.state.current) this.setState({ current: i }); }\n    }), { rootMargin: '-45% 0px -50% 0px' });\n    secs.forEach(s => spy.observe(s));\n    this._obs = [spy];\n    const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    if (reduced || !(this.props.sectionMotion ?? true)) return;\n    const ease = 'cubic-bezier(.16,.8,.2,1)';\n    secs.forEach((sec, i) => {\n      const dir = i % 2 ? -1 : 1;\n      const items = [];\n      [...sec.children].forEach(ch => ch.hasAttribute('data-stagger') ? items.push(...ch.children) : items.push(ch));\n      sec._items = items; sec._dir = dir;\n      items.forEach(el => { el.style.opacity = '0'; });\n    });\n    let lastY = window.scrollY, up = false;\n    const onScroll = () => { const y = window.scrollY; if (y !== lastY) up = y < lastY; lastY = y; };\n    window.addEventListener('scroll', onScroll, { passive: true });\n    this._obs.push({ disconnect: () => window.removeEventListener('scroll', onScroll) });\n    const reveal = sec => {\n      if (sec._done) return; sec._done = true;\n      const dir = up ? -sec._dir : sec._dir, dy = up ? -48 : 48, n = sec._items.length;\n      sec._anims = sec._items.map((el, idx) => {\n        const k = up ? n - 1 - idx : idx;\n        const isRule = el.hasAttribute('data-rule');\n        const origin = dir > 0 ? 'right' : 'left';\n        const from = isRule ? { opacity: 1, transform: 'scaleX(0)', transformOrigin: origin } : { opacity: 0, transform: `translate(${dir * 120}px, ${dy}px)` };\n        const to = isRule ? { opacity: 1, transform: 'scaleX(1)', transformOrigin: origin } : { opacity: 1, transform: 'translate(0, 0)' };\n        const a = el.animate([from, to], { duration: isRule ? 1100 : 950, delay: Math.min(k, 8) * 90, easing: ease, fill: 'both' });\n        a.finished.then(() => { el.style.opacity = ''; a.cancel(); }).catch(() => {});\n        return a;\n      });\n    };\n    const reset = sec => {\n      if (!sec._done) return; sec._done = false;\n      (sec._anims || []).forEach(a => a.cancel());\n      sec._items.forEach(el => { el.style.opacity = '0'; });\n    };\n    const io = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) reveal(en.target); }), { threshold: 0.08, rootMargin: '-8% 0px -8% 0px' });\n    const out = new IntersectionObserver(es => es.forEach(en => { if (!en.isIntersecting) reset(en.target); }), { threshold: 0 });\n    secs.forEach(s => { io.observe(s); out.observe(s); });\n    this._obs.push(io, out);\n  }\n\n  exec(cmd) {\n    const c = cmd.trim().toLowerCase();\n    const cmdLine = { isCmd: true, isOut: false, isLink: false, text: cmd.trim() };\n    if (c === 'ls' || c === 'ls sections') return [cmdLine, ...SECTIONS.slice(1).map((s, i) => ({ isCmd: false, isOut: false, isLink: true, id: s.id, num: String(i + 2).padStart(2, '0'), slug: s.label.toLowerCase() }))];\n    if (c.startsWith('cd ')) {\n      const t = c.slice(3).replace(/^\\.\\/|^\\d+-/g, '');\n      const s = SECTIONS.find(x => x.id === t || x.label.toLowerCase() === t);\n      if (s) { setTimeout(() => { const el = document.getElementById(s.id); if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 64, behavior: 'smooth' }); }, 150); return [cmdLine, { isCmd: false, isOut: true, isLink: false, text: 'Opening ' + s.label + '…' }]; }\n    }\n    const out = OUT[c] || [`command not found: ${cmd.trim()} — type “help”`];\n    return [cmdLine, ...out.map(t => ({ isCmd: false, isOut: true, isLink: false, text: t }))];\n  }\n  run(cmd) {\n    if (!cmd.trim()) return;\n    if (cmd.trim().toLowerCase() === 'clear') return this.setState({ lines: [], input: '' });\n    this.setState(s => ({ lines: [...s.lines, ...this.exec(cmd)], input: '' }));\n  }\n  async play(seq) {\n    const wait = ms => new Promise(r => setTimeout(r, ms));\n    this.setState({ busy: true });\n    await wait(500);\n    for (const cmd of seq) {\n      for (let i = 1; i <= cmd.length; i++) { if (!this._alive) return; this.setState({ typing: cmd.slice(0, i) }); await wait(70); }\n      await wait(260);\n      if (!this._alive) return;\n      this.setState(s => ({ lines: [...s.lines, ...this.exec(cmd)], typing: '' }));\n      await wait(650);\n    }\n    if (this._alive) this.setState({ busy: false });\n  }\n\n  renderVals() {\n    const { busy, filter } = this.state;\n    const duo = this.props.duotonePortrait ?? false;\n    return {\n      lines: this.state.lines,\n      bodyRef: this.bodyRef,\n      mainRef: this.mainRef,\n      curNum: String(this.state.current + 1).padStart(2, '0'),\n      curLabel: SECTIONS[this.state.current].label,\n      navSections: SECTIONS.map((s, i) => ({ ...s, active: i === this.state.current, inactive: i !== this.state.current })),\n      inputRef: this.inputRef,\n      busy,\n      inputValue: busy ? this.state.typing : this.state.input,\n      onInput: e => this.setState({ input: e.target.value }),\n      onKey: e => { if (e.key === 'Enter' && !busy) this.run(this.state.input); },\n      focusInput: () => { if (!busy && this.inputRef.current) this.inputRef.current.focus({ preventScroll: true }); },\n      jumpLinks: SECTIONS.slice(1).map((s, i) => ({ ...s, num: String(i + 2).padStart(2, '0') })),\n      duotone: duo, natural: !duo,\n      themes: THEMES,\n      projects: PROJECTS,\n      showFilter: this.props.showTimelineFilter ?? true,\n      filters: ['All', 'Research', 'Industry'].map(label => ({ label, active: label === filter, inactive: label !== filter, pick: () => this.setState({ filter: label }) })),\n      experience: EXPERIENCE.map(e => ({ ...e, logoSrc: LOGOS[e.logo] || \"\", hasLogo: !!LOGOS[e.logo] })).filter(e => filter === 'All' || e.kind === filter),\n      pubs: PUBS.map(p => ({ ...p, hasLink: !!p.href })),\n      honors: HONORS\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody>
